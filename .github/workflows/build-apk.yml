name: Build S23 Ultra GigaCam APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Pre-installed Android SDK 35
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Debug APK for Samsung Galaxy S23 Ultra (arm64-v8a)
        run: |
          if [ -z "$(find . -maxdepth 3 -name 'settings.gradle.kts')" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting archive: $ZIP_FILE"
              unzip -qo "$ZIP_FILE" -d S23UltraGigaCam_extracted
            fi
          fi
          SETTINGS_FILE=$(find . -maxdepth 4 -name 'settings.gradle.kts' | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_DIR"

          python3 - << 'PY'
          import pathlib
          m = pathlib.Path("app/src/main/java/com/s23ultra/gigacam/camera/S23UltraLensMapper.kt")
          if m.exists():
              t = m.read_text()
              t = t.replace("stdMap?.getOutputSizes(ImageFormat.JPEG).orEmpty()", "stdMap?.getOutputSizes(ImageFormat.JPEG) ?: emptyArray()")
              t = t.replace("maxMap?.getOutputSizes(ImageFormat.JPEG).orEmpty()", "(maxMap?.getOutputSizes(ImageFormat.JPEG) ?: emptyArray())")
              t = t.replace("stdMap?.getHighResolutionOutputSizes(ImageFormat.JPEG).orEmpty()", "stdMap?.getHighResolutionOutputSizes(ImageFormat.JPEG) ?: emptyArray()")
              t = t.replace("chars.get(CameraCharacteristics.REQUEST_AVAILABLE_CAPABILITIES).orEmpty()", "chars.get(CameraCharacteristics.REQUEST_AVAILABLE_CAPABILITIES) ?: IntArray(0)")
              m.write_text(t)
          c = pathlib.Path("app/src/main/java/com/s23ultra/gigacam/camera/ProCamera2Controller.kt")
          if c.exists():
              t = c.read_text()
              t = t.replace("CaptureRequest.SENSOR_PIXEL_MODE_MAXIMUM_RESOLUTION", "CameraMetadata.SENSOR_PIXEL_MODE_MAXIMUM_RESOLUTION")
              t = t.replace(
                  "DngCreator(chars, captureResult).use { dng ->\n                    FileOutputStream(outFile).use { fos ->\n                        dng.writeImage(fos, rawImg)\n                    }\n                }",
                  "val dng = DngCreator(chars, captureResult)\n                try {\n                    FileOutputStream(outFile).use { fos -> dng.writeImage(fos, rawImg) }\n                } finally { dng.close() }"
              )
              c.write_text(t)
          a = pathlib.Path("app/src/main/java/com/s23ultra/gigacam/processing/AiEnhancementEngine.kt")
          if a.exists():
              t = a.read_text()
              t = t.replace("tensor.use { t ->\n                    session.run(mapOf(inputName to t)).use { results ->", "try {\n                    val results = session.run(mapOf(inputName to tensor))\n                    try {")
              t = t.replace("                        )\n                    }\n                }\n                x += stride", "                        )\n                    } finally { results.close() }\n                } finally { tensor.close() }\n                x += stride")
              a.write_text(t)
          gp = pathlib.Path("gradle.properties")
          if gp.exists():
              gp.write_text("org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\nandroid.nonTransitiveRClass=true\n")
          PY

          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/S23UltraGigaCam-S23U.apk"
          ls -lh "$GITHUB_WORKSPACE/S23UltraGigaCam-S23U.apk"

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S23UltraGigaCam-APK
          path: S23UltraGigaCam-S23U.apk
          retention-days: 30
