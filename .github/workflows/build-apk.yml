name: Build S23 Ultra GigaCam APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Pre-installed Android SDK 35
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Debug APK for Samsung Galaxy S23 Ultra (arm64-v8a)
        run: |
          if [ -z "$(find . -maxdepth 3 -name 'settings.gradle.kts')" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting archive: $ZIP_FILE"
              unzip -qo "$ZIP_FILE" -d S23UltraGigaCam_extracted
            fi
          fi
          SETTINGS_FILE=$(find . -maxdepth 4 -name 'settings.gradle.kts' | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/S23UltraGigaCam-S23U.apk"
          ls -lh "$GITHUB_WORKSPACE/S23UltraGigaCam-S23U.apk"

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S23UltraGigaCam-APK
          path: S23UltraGigaCam-S23U.apk
          retention-days: 30
